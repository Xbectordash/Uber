name: uber_clone
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2  

  cupertino_icons: ^1.0.8
  bloc: ^9.0.0
  go_router: ^16.0.0
  google_fonts: ^6.2.1
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  sliding_up_panel: ^2.0.0
  google_maps_flutter: ^2.12.3
  flutter_dotenv: ^5.2.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  jwt_decoder: ^2.0.1
  socket_io_client: ^3.1.2
  lottie: ^3.0.0
  flutter_polyline_points: ^2.1.0
  flutter_gen: ^5.10.0

  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/vechicle/
    - assets/animations/waiting.json


  fonts:
    # OpenSans font family with all available variants in assets/fonts/
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-SemiBoldItalic.ttf
          weight: 600
          style: italic
        # Condensed
        - asset: assets/fonts/OpenSans_Condensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans_Condensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans_Condensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans_Condensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/OpenSans_Condensed-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans_Condensed-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans_Condensed-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/OpenSans_Condensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans_Condensed-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/OpenSans_Condensed-Regular.ttf
        - asset: assets/fonts/OpenSans_Condensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans_Condensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
        # SemiCondensed
        - asset: assets/fonts/OpenSans_SemiCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans_SemiCondensed-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans_SemiCondensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/OpenSans_SemiCondensed-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/OpenSans_SemiCondensed-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans_SemiCondensed-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans_SemiCondensed-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/OpenSans_SemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/OpenSans_SemiCondensed-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/OpenSans_SemiCondensed-Regular.ttf
        - asset: assets/fonts/OpenSans_SemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans_SemiCondensed-SemiBoldItalic.ttf
          weight: 600
          style: italic
